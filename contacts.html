<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<header class="header">
    <h1 class="header__title">Мій перший лендинг</h1>
    <nav class="navigation" aria-label="Головна навігація">
        <ul class="navigation__list">
            <li class="navigation__item"><a href="index.html" class="navigation__link" aria-current="page">Головна</a></li>
            <li class="navigation__item"><a href="about.html" class="navigation__link">Про нас</a></li>
            <li class="navigation__item"><a href="contacts.html" class="navigation__link">Контакти</a></li>
        </ul>
    </nav>
</header>

<main class="main" id="main">
    <h2 class="main__title">Зв'яжіться з нами</h2>

    <form class="contact-form" action="#" method="post" aria-labelledby="contact-form-title">
        <h3 class="contact-form__title" id="contact-form-title">Форма зворотного зв'язку</h3>

        <div class="contact-form__item">
            <label for="name" class="contact-form__label">Ім'я</label>
            <input
                    type="text"
                    id="name"
                    name="name"
                    class="contact-form__input"
                    placeholder="Ваше ім'я"
                    required
                    minlength="2"
                    maxlength="50"
                    pattern="^[А-Яа-яЇїІіЄєҐґA-Za-z\s\-']+$"
                    title="Ім'я може містити лише літери, апостроф або дефіс"
            />
        </div>

        <div class="contact-form__item">
            <label for="email" class="contact-form__label">Email</label>
            <input
                    type="email"
                    id="email"
                    name="email"
                    class="contact-form__input"
                    placeholder="Ваш email"
                    required
            />
        </div>

        <div class="contact-form__item">
            <label for="phone" class="contact-form__label">Телефон</label>
            <input
                    type="tel"
                    id="phone"
                    name="phone"
                    class="contact-form__input"
                    placeholder="+380XXXXXXXXX"
                    required
                    pattern="^(\+?38)?\s?0\d{2}\s?\d{3}\s?\d{2}\s?\d{2}$"
                    title="Введіть номер у форматі +380XXXXXXXXX"
            />
        </div>

        <div class="contact-form__item">
            <label for="msg" class="contact-form__label">Повідомлення</label>
            <textarea
                    id="msg"
                    name="msg"
                    class="contact-form__textarea"
                    placeholder="Ваше повідомлення"
                    rows="5"
                    required
                    minlength="10"
                    maxlength="500"
            ></textarea>
        </div>

        <button type="submit" class="contact-form__button">Надіслати</button>
    </form>

    <section class="contacts" aria-labelledby="contacts-title">
        <h3 class="contacts__title" id="contacts-title">Наші контакти</h3>
        <address class="contacts__address">
            <p class="contacts__item">Email: <a href="mailto:example@mail.com" class="contacts__link">example@mail.com</a></p>
            <p class="contacts__item">Телефон: <a href="tel:+380501234567" class="contacts__link">+38 (050) 123-45-67</a></p>
            <p class="contacts__item">Адреса: м. Запоріжжя, вул. Університетська, 65</p>
        </address>
    </section>
</main>
<aside class="sidebar sidebar--social" aria-label="Соціальні мережі">
    <h3 class="sidebar__title">Соціальні мережі</h3>
    <ul class="sidebar__list">
        <li class="sidebar__item"><a href="#" aria-label="Ми у Facebook" class="sidebar__link">Facebook</a></li>
        <li class="sidebar__item"><a href="#" aria-label="Ми у Instagram" class="sidebar__link">Instagram</a></li>
        <li class="sidebar__item"><a href="#" aria-label="Ми у LinkedIn" class="sidebar__link">LinkedIn</a></li>
    </ul>
</aside>
<footer class="site-footer">
    <p>© 2026 6-1214-пі-2</p>
</footer>
</body>
</html>
